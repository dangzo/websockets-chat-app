services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      WS_HOST: 0.0.0.0
    expose:
      - "3001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped