services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      WS_HOST: 0.0.0.0
    expose:
      - "3001"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped